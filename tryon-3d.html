<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="True 3D try-on — a real 3D puffer that wraps onto your body." />
  <meta name="theme-color" content="#000000" />
  <title>3D Try On · OOTD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A5%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* WebGL canvas holds the 3D garment; it sits over the camera feed. */
    #gl { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  </style>
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <main id="app">
    <video id="cam" playsinline autoplay muted></video>
    <canvas id="gl"></canvas>

    <!-- Back to the flat (SVG) try-on -->
    <a class="mode-link" href="index.html">‹ 2D</a>

    <p id="hint">Step back so your upper body is in view</p>

    <div id="controls">
      <button id="flip" class="ctl" type="button" aria-label="Flip camera">🔄</button>
      <button id="shot" class="shutter" type="button" aria-label="Take photo"><span></span></button>
      <span class="ctl-spacer" aria-hidden="true"></span>
    </div>

    <div id="start" class="screen" hidden>
      <div class="screen-inner">
        <div class="screen-emoji">🧥</div>
        <button id="start-btn" class="big-btn" type="button">Tap to open camera</button>
      </div>
    </div>

    <div id="error" class="screen" hidden>
      <div class="screen-inner">
        <div class="screen-emoji">📷</div>
        <p id="error-msg"></p>
        <button id="retry-btn" class="big-btn" type="button">Try again</button>
      </div>
    </div>

    <div id="result" class="screen" hidden>
      <img id="photo" alt="Your 3D try-on photo" />
      <div id="result-actions">
        <button id="retake" class="big-btn ghost" type="button">↺ Retake</button>
        <a id="save" class="big-btn" download="my-ootd-3d.jpg">⬇ Save photo</a>
      </div>
    </div>

    <canvas id="canvas" hidden></canvas>
  </main>

  <script type="module">
    import * as THREE from "three";
    import { buildPuffer, buildStudioEnv } from "./puffer3d.js";

    var TASKS_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.20";
    var WASM_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.20/wasm";
    var MODEL_URL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";

    // Fit knobs — tune on-device.
    var DIST = 2.2;        // metres the garment sits in front of the camera
    var OVERSIZE = 1.9;    // garment width vs shoulder width (puffer is oversized)
    var DROP = 0.58;       // how far below the shoulder line the torso centre sits
    var SMOOTH = 0.35;

    var byId = function (id) { return document.getElementById(id); };
    var cam = byId("cam"), glCanvas = byId("gl"), hint = byId("hint");
    var canvas = byId("canvas"), photo = byId("photo"), saveLink = byId("save");
    var startScreen = byId("start"), errorScreen = byId("error"), errorMsg = byId("error-msg"), resultScreen = byId("result");

    var stream = null, facing = "user", landmarker = null, tracking = false, running = false;
    var raf = 0, lastTs = 0, lostFrames = 0, visible = false;

    // ---- Three.js scene ----
    var renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    var scene = new THREE.Scene();
    var camera3 = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
    camera3.position.set(0, 0, 0);
    var env = buildStudioEnv(renderer);
    scene.environment = env;
    var puffer = buildPuffer(env);
    puffer.visible = false;
    scene.add(puffer);
    scene.add(new THREE.AmbientLight(0xffffff, 0.14));
    var key = new THREE.DirectionalLight(0xffffff, 0.5); key.position.set(-2, 3, 3); scene.add(key);
    var rim = new THREE.DirectionalLight(0xbcd0ff, 0.3); rim.position.set(2, 1, -3); scene.add(rim);

    var target = { pos: new THREE.Vector3(0, 0, -DIST), scale: 1, roll: 0 };
    var tmp = new THREE.Vector3();

    function resize() {
      var w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera3.aspect = w / h; camera3.updateProjectionMatrix();
    }
    window.addEventListener("resize", resize);
    resize();

    // ---- Controls ----
    byId("flip").addEventListener("click", flip);
    byId("shot").addEventListener("click", capture);
    byId("retake").addEventListener("click", retake);
    byId("start-btn").addEventListener("click", function () { hide(startScreen); openCamera(); });
    byId("retry-btn").addEventListener("click", function () { hide(errorScreen); openCamera(); });

    initPose();
    openCamera();

    function initPose() {
      import(TASKS_URL).then(function (vision) {
        return vision.FilesetResolver.forVisionTasks(WASM_URL).then(function (resolver) {
          return make(vision, resolver, "GPU").catch(function () { return make(vision, resolver, "CPU"); });
        });
      }).then(function (lm) { landmarker = lm; tracking = true; })
        .catch(function () { tracking = false; });
    }
    function make(vision, resolver, delegate) {
      return vision.PoseLandmarker.createFromOptions(resolver, {
        baseOptions: { modelAssetPath: MODEL_URL, delegate: delegate },
        runningMode: "VIDEO", numPoses: 1
      });
    }

    function openCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
        return fail("This browser can't open the camera. Try Safari or Chrome on a phone.");
      stopTracks();
      navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: facing } } })
        .then(function (s) {
          stream = s; cam.srcObject = s;
          cam.classList.toggle("mirror", facing === "user");
          var p = cam.play(); if (p && p.catch) p.catch(function () {});
          running = true;
          cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
        })
        .catch(function (err) {
          var n = err && err.name;
          if (n === "NotAllowedError" || n === "SecurityError") show(startScreen);
          else if (n === "NotFoundError" || n === "OverconstrainedError") fail("No camera found on this device.");
          else fail("Couldn't open the camera. Make sure no other app is using it, then try again.");
        });
    }

    function flip() { facing = facing === "user" ? "environment" : "user"; visible = false; openCamera(); }

    function loop() {
      if (!running) return;
      if (tracking && landmarker && cam.videoWidth) {
        var ts = performance.now(); if (ts <= lastTs) ts = lastTs + 1; lastTs = ts;
        try {
          var res = landmarker.detectForVideo(cam, ts);
          if (res && res.landmarks && res.landmarks[0]) fit(res.landmarks[0]);
          else markLost();
        } catch (e) { /* skip */ }
      }
      draw();
      raf = requestAnimationFrame(loop);
    }

    // Map a normalized landmark to on-screen pixels (object-fit: cover + mirror).
    function toDisplay(pt) {
      var cw = cam.clientWidth, ch = cam.clientHeight, vw = cam.videoWidth, vh = cam.videoHeight;
      var scale = Math.max(cw / vw, ch / vh);
      var dx = (pt.x * vw - (vw - cw / scale) / 2) * scale;
      var dy = (pt.y * vh - (vh - ch / scale) / 2) * scale;
      if (facing === "user") dx = cw - dx;
      return { x: dx, y: dy };
    }

    function fit(lm) {
      var LS = lm[11], RS = lm[12];
      if (!LS || !RS) return markLost();
      if (vis(LS) < 0.5 || vis(RS) < 0.5) return markLost();
      var ls = toDisplay(LS), rs = toDisplay(RS);
      var span = Math.hypot(rs.x - ls.x, rs.y - ls.y);
      if (!span) return markLost();

      var mid = { x: (ls.x + rs.x) / 2, y: (ls.y + rs.y) / 2 };
      var ex = { x: (rs.x - ls.x) / span, y: (rs.y - ls.y) / span };
      var down = { x: -ex.y, y: ex.x };
      if (down.y < 0) { down.x = -down.x; down.y = -down.y; }
      var chest = { x: mid.x + down.x * span * DROP, y: mid.y + down.y * span * DROP };

      var w = window.innerWidth, h = window.innerHeight;
      var vFov = THREE.MathUtils.degToRad(camera3.fov);
      var worldH = 2 * Math.tan(vFov / 2) * DIST;
      var unitsPerPx = worldH / h;
      var ndcX = chest.x / w * 2 - 1, ndcY = -(chest.y / h * 2 - 1);
      target.pos.set(ndcX * (worldH * camera3.aspect) / 2, ndcY * worldH / 2, -DIST);

      var shoulderWorld = span * unitsPerPx;
      target.scale = shoulderWorld * OVERSIZE; // body local width ~1 unit
      target.roll = Math.atan2(rs.y - ls.y, rs.x - ls.x);

      lostFrames = 0; visible = true; hint.style.display = "none";
    }

    function markLost() { if (++lostFrames > 18) visible = false; }

    function draw() {
      puffer.visible = visible;
      if (visible) {
        puffer.position.lerp(target.pos, SMOOTH);
        var s = puffer.scale.x + (target.scale - puffer.scale.x) * SMOOTH;
        puffer.scale.setScalar(s);
        puffer.rotation.z += (-target.roll - puffer.rotation.z) * SMOOTH;
      }
      renderer.render(scene, camera3);
    }

    // ---- Capture: camera frame + the 3D render, composited ----
    function capture() {
      if (!stream || !cam.videoWidth) return;
      running = false; cancelAnimationFrame(raf);
      var cw = cam.clientWidth, ch = cam.clientHeight, vw = cam.videoWidth, vh = cam.videoHeight;
      canvas.width = cw; canvas.height = ch;
      var ctx = canvas.getContext("2d");
      var scale = Math.max(cw / vw, ch / vh);
      var visW = cw / scale, visH = ch / scale, sx = (vw - visW) / 2, sy = (vh - visH) / 2;
      if (facing === "user") { ctx.translate(cw, 0); ctx.scale(-1, 1); }
      ctx.drawImage(cam, sx, sy, visW, visH, 0, 0, cw, ch);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      renderer.render(scene, camera3);
      ctx.drawImage(glCanvas, 0, 0, cw, ch);
      var url = canvas.toDataURL("image/jpeg", 0.92);
      photo.src = url; saveLink.href = url;
      show(resultScreen); stopTracks();
    }

    function retake() { hide(resultScreen); photo.removeAttribute("src"); visible = false; openCamera(); }

    function fail(m) { running = false; errorMsg.textContent = m; show(errorScreen); }
    function stopTracks() {
      running = false; cancelAnimationFrame(raf);
      if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
      cam.srcObject = null;
    }
    function vis(p) { return p.visibility === undefined ? 1 : p.visibility; }
    function show(el) { el.hidden = false; }
    function hide(el) { el.hidden = true; }
  </script>
</body>
</html>
