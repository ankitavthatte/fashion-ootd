<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Try the jacket on — just open the camera and wear it." />
  <meta name="theme-color" content="#000000" />
  <title>Try On · OOTD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A5%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <!-- Live camera -->
    <video id="cam" playsinline autoplay muted></video>

    <!-- The jacket sits on top of the camera. Move so it lines up with your shoulders. -->
    <div id="overlay">
      <svg id="jacket" viewBox="0 0 320 340" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Jacket">
        <defs>
          <linearGradient id="denim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5b86c9" />
            <stop offset="1" stop-color="#375a97" />
          </linearGradient>
          <linearGradient id="denimDark" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3f6099" />
            <stop offset="1" stop-color="#294470" />
          </linearGradient>
        </defs>
        <g stroke="#1d3253" stroke-width="2.5" stroke-linejoin="round">
          <path d="M92 78 L36 96 L60 250 L112 236 L108 120 Z" fill="url(#denimDark)" />
          <path d="M228 78 L284 96 L260 250 L208 236 L212 120 Z" fill="url(#denimDark)" />
          <path d="M108 70 L160 96 L212 70 L214 300 L160 312 L106 300 Z" fill="url(#denim)" />
          <path d="M108 70 L160 96 L132 132 L100 104 Z" fill="url(#denimDark)" />
          <path d="M212 70 L160 96 L188 132 L220 104 Z" fill="url(#denimDark)" />
        </g>
        <line x1="160" y1="96" x2="160" y2="300" stroke="#1d3253" stroke-width="2.5" />
        <g fill="none" stroke="#1d3253" stroke-width="2.5" stroke-linejoin="round">
          <path d="M120 150 h30 v26 h-30 z" />
          <path d="M170 150 h30 v26 h-30 z" />
        </g>
        <g fill="#e0c97e" stroke="#8a7326" stroke-width="1">
          <circle cx="160" cy="150" r="5" />
          <circle cx="160" cy="188" r="5" />
          <circle cx="160" cy="226" r="5" />
          <circle cx="160" cy="264" r="5" />
          <circle cx="135" cy="176" r="3" />
          <circle cx="185" cy="176" r="3" />
        </g>
      </svg>
    </div>

    <!-- Gentle hint, fades on its own -->
    <p id="hint">Step back so your upper body is in view</p>

    <!-- Live controls -->
    <div id="controls">
      <button id="flip" class="ctl" type="button" aria-label="Flip camera">🔄</button>
      <button id="shot" class="shutter" type="button" aria-label="Take photo"><span></span></button>
      <span class="ctl-spacer" aria-hidden="true"></span>
    </div>

    <!-- Tap-to-start fallback (shown only if the camera can't auto-open) -->
    <div id="start" class="screen" hidden>
      <div class="screen-inner">
        <div class="screen-emoji">🧥</div>
        <button id="start-btn" class="big-btn" type="button">Tap to open camera</button>
      </div>
    </div>

    <!-- Error screen -->
    <div id="error" class="screen" hidden>
      <div class="screen-inner">
        <div class="screen-emoji">📷</div>
        <p id="error-msg"></p>
        <button id="retry-btn" class="big-btn" type="button">Try again</button>
      </div>
    </div>

    <!-- Result after capture -->
    <div id="result" class="screen" hidden>
      <img id="photo" alt="Your try-on photo" />
      <div id="result-actions">
        <button id="retake" class="big-btn ghost" type="button">↺ Retake</button>
        <a id="save" class="big-btn" download="my-ootd.jpg">⬇ Save photo</a>
      </div>
    </div>

    <canvas id="canvas" hidden></canvas>
  </main>

  <script src="app.js"></script>
</body>
</html>
