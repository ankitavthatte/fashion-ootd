<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Try the jacket on — just open the camera and wear it." />
  <meta name="theme-color" content="#000000" />
  <title>Try On · OOTD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A5%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <!-- Live camera -->
    <video id="cam" playsinline autoplay muted></video>

    <!-- Contact shadow (multiplies onto the body to ground the jacket) -->
    <div id="shadow">
      <svg viewBox="0 0 320 340" preserveAspectRatio="none" aria-hidden="true">
        <path d="M92 108 L54 286 Q52 298 64 300 L84 298 Q100 250 104 206 Q106 252 108 302 Q134 313 160 313 Q186 313 212 302 Q214 252 216 206 Q220 250 236 298 L256 300 Q268 298 266 286 L228 108 Q160 98 92 108 Z" fill="#000" />
      </svg>
    </div>

    <!-- The glossy puffer, warped in real perspective onto your torso by app.js. -->
    <div id="overlay">
      <svg id="jacket" viewBox="0 0 320 340" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-label="Yellow puffer jacket">
        <defs>
          <linearGradient id="baf" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#b56800"/>
            <stop offset="0.10" stop-color="#ffdc63"/>
            <stop offset="0.30" stop-color="#ffc22c"/>
            <stop offset="0.55" stop-color="#f7a900"/>
            <stop offset="0.80" stop-color="#cf7a00"/>
            <stop offset="1" stop-color="#7e4600"/>
          </linearGradient>
          <radialGradient id="gloss" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#fffdf4" stop-opacity="0.85"/>
            <stop offset="0.45" stop-color="#fff0bf" stop-opacity="0.35"/>
            <stop offset="1" stop-color="#fff0bf" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="bodyCyl" x1="100" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#5e3200" stop-opacity="0.55"/>
            <stop offset="0.18" stop-color="#7a4300" stop-opacity="0.18"/>
            <stop offset="0.4" stop-color="#7a4300" stop-opacity="0"/>
            <stop offset="0.6" stop-color="#7a4300" stop-opacity="0"/>
            <stop offset="0.82" stop-color="#7a4300" stop-opacity="0.18"/>
            <stop offset="1" stop-color="#5e3200" stop-opacity="0.55"/>
          </linearGradient>
          <linearGradient id="slLCyl" x1="52" y1="0" x2="106" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#5e3200" stop-opacity="0.6"/>
            <stop offset="0.4" stop-color="#7a4300" stop-opacity="0"/>
            <stop offset="0.72" stop-color="#7a4300" stop-opacity="0.28"/>
            <stop offset="1" stop-color="#5e3200" stop-opacity="0.62"/>
          </linearGradient>
          <linearGradient id="slRCyl" x1="214" y1="0" x2="268" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#5e3200" stop-opacity="0.62"/>
            <stop offset="0.28" stop-color="#7a4300" stop-opacity="0.28"/>
            <stop offset="0.6" stop-color="#7a4300" stop-opacity="0"/>
            <stop offset="1" stop-color="#5e3200" stop-opacity="0.6"/>
          </linearGradient>
          <radialGradient id="collarG" cx="0.42" cy="0.32" r="0.75">
            <stop offset="0" stop-color="#ffe27a"/>
            <stop offset="0.5" stop-color="#f9b100"/>
            <stop offset="1" stop-color="#b06600"/>
          </radialGradient>
          <filter id="b1"><feGaussianBlur stdDeviation="1.1"/></filter>
          <filter id="b2"><feGaussianBlur stdDeviation="2.4"/></filter>
          <path id="sil" d="M92 108 L54 286 Q52 298 64 300 L84 298 Q100 250 104 206 Q106 252 108 302 Q134 313 160 313 Q186 313 212 302 Q214 252 216 206 Q220 250 236 298 L256 300 Q268 298 266 286 L228 108 Q160 98 92 108 Z"/>
          <clipPath id="cBody"><path d="M100 106 Q160 97 220 106 L216 300 Q160 315 104 300 Z"/></clipPath>
          <clipPath id="cSLL"><path d="M92 108 L54 286 Q52 298 64 300 L84 298 Q101 250 104 206 Q102 150 100 106 Q95 105 92 108 Z"/></clipPath>
          <clipPath id="cSLR"><path d="M228 108 L266 286 Q268 298 256 300 L236 298 Q219 250 216 206 Q218 150 220 106 Q225 105 228 108 Z"/></clipPath>
          <clipPath id="cSil"><use href="#sil"/></clipPath>
        </defs>
      
        <!-- base -->
        <use href="#sil" fill="#f4a900"/>
      
        <!-- soft drop shadow of sleeves behind body for layering -->
        <g clip-path="url(#cSil)">
          <path d="M100 106 Q160 97 220 106 L216 300 Q160 315 104 300 Z" fill="#000" opacity="0.16" filter="url(#b2)" transform="translate(0,3)"/>
        </g>
      
        <!-- LEFT sleeve: horizontal ring baffles + cylinder shade -->
        <g clip-path="url(#cSLL)">
          <rect x="46" y="110.0" width="70" height="31.3" fill="url(#baf)"/><rect x="50" y="139.1" width="62" height="3" fill="#4e2900" opacity="0.55" filter="url(#b1)"/><rect x="54" y="136.7" width="54" height="1.5" fill="#fff0a8" opacity="0.4"/><rect x="46" y="141.3" width="70" height="31.3" fill="url(#baf)"/><rect x="50" y="170.5" width="62" height="3" fill="#4e2900" opacity="0.55" filter="url(#b1)"/><rect x="54" y="168.1" width="54" height="1.5" fill="#fff0a8" opacity="0.4"/><rect x="46" y="172.7" width="70" height="31.3" fill="url(#baf)"/><rect x="50" y="201.8" width="62" height="3" fill="#4e2900" opacity="0.55" filter="url(#b1)"/><rect x="54" y="199.4" width="54" height="1.5" fill="#fff0a8" opacity="0.4"/><rect x="46" y="204.0" width="70" height="31.3" fill="url(#baf)"/><rect x="50" y="233.1" width="62" height="3" fill="#4e2900" opacity="0.55" filter="url(#b1)"/><rect x="54" y="230.7" width="54" height="1.5" fill="#fff0a8" opacity="0.4"/><rect x="46" y="235.3" width="70" height="31.3" fill="url(#baf)"/><rect x="50" y="264.5" width="62" height="3" fill="#4e2900" opacity="0.55" filter="url(#b1)"/><rect x="54" y="262.1" width="54" height="1.5" fill="#fff0a8" opacity="0.4"/><rect x="46" y="266.7" width="70" height="31.3" fill="url(#baf)"/><rect x="50" y="295.8" width="62" height="3" fill="#4e2900" opacity="0.55" filter="url(#b1)"/><rect x="54" y="293.4" width="54" height="1.5" fill="#fff0a8" opacity="0.4"/>
          <rect x="46" y="104" width="70" height="200" fill="url(#slLCyl)"/>
          <ellipse cx="76" cy="118.5" rx="28.0" ry="4.1" fill="url(#gloss)" opacity="0.72"/><ellipse cx="68.2" cy="117.8" rx="14.0" ry="2.2" fill="#fffdf6" opacity="0.65"/><ellipse cx="76" cy="149.8" rx="28.0" ry="4.1" fill="url(#gloss)" opacity="0.63"/><ellipse cx="68.2" cy="149.2" rx="14.0" ry="2.2" fill="#fffdf6" opacity="0.57"/><ellipse cx="76" cy="181.1" rx="28.0" ry="4.1" fill="url(#gloss)" opacity="0.55"/><ellipse cx="68.2" cy="180.5" rx="14.0" ry="2.2" fill="#fffdf6" opacity="0.49"/><ellipse cx="76" cy="212.5" rx="28.0" ry="4.1" fill="url(#gloss)" opacity="0.46"/><ellipse cx="68.2" cy="211.8" rx="14.0" ry="2.2" fill="#fffdf6" opacity="0.41"/><ellipse cx="76" cy="243.8" rx="28.0" ry="4.1" fill="url(#gloss)" opacity="0.37"/><ellipse cx="68.2" cy="243.2" rx="14.0" ry="2.2" fill="#fffdf6" opacity="0.34"/><ellipse cx="76" cy="275.1" rx="28.0" ry="4.1" fill="url(#gloss)" opacity="0.29"/><ellipse cx="68.2" cy="274.5" rx="14.0" ry="2.2" fill="#fffdf6" opacity="0.26"/>
        </g>
        <!-- RIGHT sleeve -->
        <g clip-path="url(#cSLR)">
          <rect x="204" y="110.0" width="70" height="31.3" fill="url(#baf)"/><rect x="208" y="139.1" width="62" height="3" fill="#4e2900" opacity="0.55" filter="url(#b1)"/><rect x="212" y="136.7" width="54" height="1.5" fill="#fff0a8" opacity="0.4"/><rect x="204" y="141.3" width="70" height="31.3" fill="url(#baf)"/><rect x="208" y="170.5" width="62" height="3" fill="#4e2900" opacity="0.55" filter="url(#b1)"/><rect x="212" y="168.1" width="54" height="1.5" fill="#fff0a8" opacity="0.4"/><rect x="204" y="172.7" width="70" height="31.3" fill="url(#baf)"/><rect x="208" y="201.8" width="62" height="3" fill="#4e2900" opacity="0.55" filter="url(#b1)"/><rect x="212" y="199.4" width="54" height="1.5" fill="#fff0a8" opacity="0.4"/><rect x="204" y="204.0" width="70" height="31.3" fill="url(#baf)"/><rect x="208" y="233.1" width="62" height="3" fill="#4e2900" opacity="0.55" filter="url(#b1)"/><rect x="212" y="230.7" width="54" height="1.5" fill="#fff0a8" opacity="0.4"/><rect x="204" y="235.3" width="70" height="31.3" fill="url(#baf)"/><rect x="208" y="264.5" width="62" height="3" fill="#4e2900" opacity="0.55" filter="url(#b1)"/><rect x="212" y="262.1" width="54" height="1.5" fill="#fff0a8" opacity="0.4"/><rect x="204" y="266.7" width="70" height="31.3" fill="url(#baf)"/><rect x="208" y="295.8" width="62" height="3" fill="#4e2900" opacity="0.55" filter="url(#b1)"/><rect x="212" y="293.4" width="54" height="1.5" fill="#fff0a8" opacity="0.4"/>
          <rect x="204" y="104" width="70" height="200" fill="url(#slRCyl)"/>
          <ellipse cx="236" cy="118.5" rx="28.0" ry="4.1" fill="url(#gloss)" opacity="0.58"/><ellipse cx="228.2" cy="117.8" rx="14.0" ry="2.2" fill="#fffdf6" opacity="0.52"/><ellipse cx="236" cy="149.8" rx="28.0" ry="4.1" fill="url(#gloss)" opacity="0.51"/><ellipse cx="228.2" cy="149.2" rx="14.0" ry="2.2" fill="#fffdf6" opacity="0.46"/><ellipse cx="236" cy="181.1" rx="28.0" ry="4.1" fill="url(#gloss)" opacity="0.44"/><ellipse cx="228.2" cy="180.5" rx="14.0" ry="2.2" fill="#fffdf6" opacity="0.40"/><ellipse cx="236" cy="212.5" rx="28.0" ry="4.1" fill="url(#gloss)" opacity="0.37"/><ellipse cx="228.2" cy="211.8" rx="14.0" ry="2.2" fill="#fffdf6" opacity="0.33"/><ellipse cx="236" cy="243.8" rx="28.0" ry="4.1" fill="url(#gloss)" opacity="0.30"/><ellipse cx="228.2" cy="243.2" rx="14.0" ry="2.2" fill="#fffdf6" opacity="0.27"/><ellipse cx="236" cy="275.1" rx="28.0" ry="4.1" fill="url(#gloss)" opacity="0.23"/><ellipse cx="228.2" cy="274.5" rx="14.0" ry="2.2" fill="#fffdf6" opacity="0.21"/>
        </g>
      
        <!-- BODY: horizontal baffles + cylinder shade + gloss -->
        <g clip-path="url(#cBody)">
          <rect x="92" y="106.0" width="136" height="32.3" fill="url(#baf)"/><rect x="96" y="136.1" width="128" height="3" fill="#4e2900" opacity="0.55" filter="url(#b1)"/><rect x="100" y="133.7" width="120" height="1.5" fill="#fff0a8" opacity="0.4"/><rect x="92" y="138.3" width="136" height="32.3" fill="url(#baf)"/><rect x="96" y="168.5" width="128" height="3" fill="#4e2900" opacity="0.55" filter="url(#b1)"/><rect x="100" y="166.1" width="120" height="1.5" fill="#fff0a8" opacity="0.4"/><rect x="92" y="170.7" width="136" height="32.3" fill="url(#baf)"/><rect x="96" y="200.8" width="128" height="3" fill="#4e2900" opacity="0.55" filter="url(#b1)"/><rect x="100" y="198.4" width="120" height="1.5" fill="#fff0a8" opacity="0.4"/><rect x="92" y="203.0" width="136" height="32.3" fill="url(#baf)"/><rect x="96" y="233.1" width="128" height="3" fill="#4e2900" opacity="0.55" filter="url(#b1)"/><rect x="100" y="230.7" width="120" height="1.5" fill="#fff0a8" opacity="0.4"/><rect x="92" y="235.3" width="136" height="32.3" fill="url(#baf)"/><rect x="96" y="265.5" width="128" height="3" fill="#4e2900" opacity="0.55" filter="url(#b1)"/><rect x="100" y="263.1" width="120" height="1.5" fill="#fff0a8" opacity="0.4"/><rect x="92" y="267.7" width="136" height="32.3" fill="url(#baf)"/><rect x="96" y="297.8" width="128" height="3" fill="#4e2900" opacity="0.55" filter="url(#b1)"/><rect x="100" y="295.4" width="120" height="1.5" fill="#fff0a8" opacity="0.4"/>
          <rect x="92" y="100" width="136" height="206" fill="url(#bodyCyl)"/>
          <ellipse cx="146" cy="114.7" rx="46.2" ry="4.2" fill="url(#gloss)" opacity="0.66"/><ellipse cx="133.1" cy="114.1" rx="23.1" ry="2.3" fill="#fffdf6" opacity="0.59"/><ellipse cx="146" cy="147.1" rx="46.2" ry="4.2" fill="url(#gloss)" opacity="0.58"/><ellipse cx="133.1" cy="146.4" rx="23.1" ry="2.3" fill="#fffdf6" opacity="0.52"/><ellipse cx="146" cy="179.4" rx="46.2" ry="4.2" fill="url(#gloss)" opacity="0.50"/><ellipse cx="133.1" cy="178.8" rx="23.1" ry="2.3" fill="#fffdf6" opacity="0.45"/><ellipse cx="146" cy="211.7" rx="46.2" ry="4.2" fill="url(#gloss)" opacity="0.42"/><ellipse cx="133.1" cy="211.1" rx="23.1" ry="2.3" fill="#fffdf6" opacity="0.38"/><ellipse cx="146" cy="244.1" rx="46.2" ry="4.2" fill="url(#gloss)" opacity="0.34"/><ellipse cx="133.1" cy="243.4" rx="23.1" ry="2.3" fill="#fffdf6" opacity="0.31"/><ellipse cx="146" cy="276.4" rx="46.2" ry="4.2" fill="url(#gloss)" opacity="0.26"/><ellipse cx="133.1" cy="275.8" rx="23.1" ry="2.3" fill="#fffdf6" opacity="0.24"/>
          <!-- broad soft environment reflections for wet-look sheen -->
          <ellipse cx="126" cy="168" rx="17" ry="78" fill="url(#gloss)" opacity="0.4" transform="rotate(-7 126 168)"/>
          <ellipse cx="194" cy="240" rx="11" ry="56" fill="url(#gloss)" opacity="0.26"/>
        </g>
      
        <!-- edge definition -->
        <use href="#sil" fill="none" stroke="#5e3200" stroke-width="1.4" stroke-opacity="0.5" stroke-linejoin="round"/>
      
        <!-- center zipper -->
        <rect x="156" y="104" width="8" height="204" rx="2" fill="#20242a"/>
        <rect x="159.4" y="106" width="1.6" height="200" fill="#7a808a" opacity="0.8"/>
        <rect x="152" y="150" width="16" height="9" rx="2" fill="#2a2e35"/>
        <rect x="158.6" y="159" width="2.8" height="16" rx="1.4" fill="#20242a"/>
      
        <!-- big puffy stand collar (glossy), on top -->
        <g stroke="#7e4600" stroke-width="1" stroke-opacity="0.4">
          <path d="M108 120 Q104 84 140 74 Q168 68 176 96 Q170 116 150 122 Q128 126 108 120 Z" fill="url(#collarG)"/>
          <path d="M212 120 Q220 82 182 72 Q150 66 146 96 Q152 118 176 122 Q196 126 212 120 Z" fill="url(#collarG)"/>
          <ellipse cx="160" cy="86" rx="34" ry="20" fill="url(#collarG)"/>
        </g>
        <g fill="url(#gloss)">
          <ellipse cx="134" cy="88" rx="20" ry="10" transform="rotate(-18 134 88)"/>
          <ellipse cx="186" cy="86" rx="22" ry="11" transform="rotate(16 186 86)"/>
          <ellipse cx="160" cy="80" rx="20" ry="7"/>
        </g>
        <g fill="#fffdf6" opacity="0.8">
          <ellipse cx="130" cy="86" rx="9" ry="3.4" transform="rotate(-18 130 86)"/>
          <ellipse cx="184" cy="84" rx="10" ry="3.6" transform="rotate(16 184 84)"/>
        </g>
      
        <!-- ribbed cuffs -->
        <g fill="#1c1f24">
          <path d="M54 284 Q52 298 64 300 L84 298 Q90 288 88 280 Q70 286 54 284 Z"/>
          <path d="M266 284 Q268 298 256 300 L236 298 Q230 288 232 280 Q250 286 266 284 Z"/>
        </g>
        <g stroke="#000" stroke-width="0.7" opacity="0.4">
          <path d="M58 286 l26 -4 M60 292 l26 -4 M234 282 l26 4 M232 288 l26 4"/>
        </g>
      </svg>
    </div>

    <!-- Gentle hint, fades on its own -->
    <p id="hint">Step back so your upper body is in view</p>

    <!-- Live controls -->
    <div id="controls">
      <button id="flip" class="ctl" type="button" aria-label="Flip camera">🔄</button>
      <button id="shot" class="shutter" type="button" aria-label="Take photo"><span></span></button>
      <span class="ctl-spacer" aria-hidden="true"></span>
    </div>

    <!-- Tap-to-start fallback (shown only if the camera can't auto-open) -->
    <div id="start" class="screen" hidden>
      <div class="screen-inner">
        <div class="screen-emoji">🧥</div>
        <button id="start-btn" class="big-btn" type="button">Tap to open camera</button>
      </div>
    </div>

    <!-- Error screen -->
    <div id="error" class="screen" hidden>
      <div class="screen-inner">
        <div class="screen-emoji">📷</div>
        <p id="error-msg"></p>
        <button id="retry-btn" class="big-btn" type="button">Try again</button>
      </div>
    </div>

    <!-- Result after capture -->
    <div id="result" class="screen" hidden>
      <img id="photo" alt="Your try-on photo" />
      <div id="result-actions">
        <button id="retake" class="big-btn ghost" type="button">↺ Retake</button>
        <a id="save" class="big-btn" download="my-ootd.jpg">⬇ Save photo</a>
      </div>
    </div>

    <canvas id="canvas" hidden></canvas>
  </main>

  <script src="app.js"></script>
</body>
</html>
