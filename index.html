<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Try the jacket on — just open the camera and wear it." />
  <meta name="theme-color" content="#000000" />
  <title>Try On · OOTD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A5%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <!-- Live camera -->
    <video id="cam" playsinline autoplay muted></video>

    <!-- Contact shadow (multiplies onto the body to ground the jacket) -->
    <div id="shadow">
      <svg viewBox="0 0 320 340" preserveAspectRatio="none" aria-hidden="true">
        <path d="M97 84 L33 102 L57 258 L107 246 L99 300 L160 316 L221 300 L213 246 L263 258 L287 102 L223 84 L198 100 L160 74 L122 100 Z" fill="#000" />
      </svg>
    </div>

    <!-- The jacket. Warped in real perspective onto your torso by app.js. -->
    <div id="overlay">
      <svg id="jacket" viewBox="0 0 320 340" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-label="Denim jacket">
        <defs>
          <linearGradient id="body" x1="0.15" y1="0" x2="0.85" y2="1">
            <stop offset="0" stop-color="#6f99d8" />
            <stop offset="0.5" stop-color="#4d76ba" />
            <stop offset="1" stop-color="#365a97" />
          </linearGradient>
          <linearGradient id="sleeveL" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#2f4f85" />
            <stop offset="0.45" stop-color="#5b86c9" />
            <stop offset="1" stop-color="#33578f" />
          </linearGradient>
          <linearGradient id="sleeveR" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#33578f" />
            <stop offset="0.55" stop-color="#5b86c9" />
            <stop offset="1" stop-color="#2f4f85" />
          </linearGradient>
          <linearGradient id="collarTop" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5f8ace" />
            <stop offset="1" stop-color="#3c619c" />
          </linearGradient>
          <radialGradient id="hi" cx="0.5" cy="0.4" r="0.6">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.5" />
            <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="edgeL" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#12233f" stop-opacity="0.55" />
            <stop offset="1" stop-color="#12233f" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="edgeR" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#12233f" stop-opacity="0" />
            <stop offset="1" stop-color="#12233f" stop-opacity="0.55" />
          </linearGradient>
          <filter id="denimTex" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.9 0.85" numOctaves="2" seed="7" result="n" />
            <feColorMatrix in="n" type="matrix"
              values="0 0 0 0 0.12  0 0 0 0 0.18  0 0 0 0 0.32  0 0 0 0.7 0" />
          </filter>
          <path id="silhouette" d="M97 84 L33 102 L57 258 L107 246 L99 300 L160 316 L221 300 L213 246 L263 258 L287 102 L223 84 L198 100 L160 74 L122 100 Z" />
          <clipPath id="clip"><use href="#silhouette" /></clipPath>
        </defs>

        <!-- Sleeves (cylindrical shading for roundness) -->
        <g stroke="#1b3053" stroke-width="2.5" stroke-linejoin="round">
          <path d="M97 84 L33 102 L57 258 L107 246 L112 120 Z" fill="url(#sleeveL)" />
          <path d="M223 84 L287 102 L263 258 L213 246 L208 120 Z" fill="url(#sleeveR)" />
        </g>

        <!-- Body -->
        <use href="#silhouette" fill="url(#body)" stroke="#1b3053" stroke-width="2.5" stroke-linejoin="round" />

        <!-- Shading + texture, clipped to the jacket silhouette -->
        <g clip-path="url(#clip)">
          <rect x="0" y="0" width="320" height="340" filter="url(#denimTex)" opacity="0.14" />
          <rect x="20" y="70" width="90" height="250" fill="url(#edgeL)" />
          <rect x="210" y="70" width="90" height="250" fill="url(#edgeR)" />
          <ellipse cx="160" cy="150" rx="70" ry="90" fill="url(#hi)" />
          <ellipse cx="120" cy="120" rx="30" ry="45" fill="url(#hi)" opacity="0.7" />
          <ellipse cx="200" cy="120" rx="30" ry="45" fill="url(#hi)" opacity="0.7" />
          <!-- fabric folds -->
          <g stroke="#1b3053" stroke-width="3" fill="none" opacity="0.16" stroke-linecap="round">
            <path d="M120 120 q-8 90 4 180" />
            <path d="M200 120 q8 90 -4 180" />
            <path d="M70 130 q-6 60 6 110" />
            <path d="M250 130 q6 60 -6 110" />
          </g>
          <!-- armpit shadows -->
          <path d="M112 120 q18 24 8 60 q-18 -20 -16 -56 z" fill="#12233f" opacity="0.3" />
          <path d="M208 120 q-18 24 -8 60 q18 -20 16 -56 z" fill="#12233f" opacity="0.3" />
        </g>

        <!-- Collar with depth (dark underside, lighter top) -->
        <g stroke="#1b3053" stroke-width="2.5" stroke-linejoin="round">
          <path d="M122 100 L160 74 L160 128 L128 150 Z" fill="#2c4c82" />
          <path d="M198 100 L160 74 L160 128 L192 150 Z" fill="#2c4c82" />
          <path d="M122 88 L160 74 L145 120 Z" fill="url(#collarTop)" />
          <path d="M198 88 L160 74 L175 120 Z" fill="url(#collarTop)" />
        </g>

        <!-- Center placket (raised strip with seams) -->
        <rect x="150" y="120" width="20" height="188" fill="#4a72b2" />
        <line x1="150" y1="120" x2="150" y2="308" stroke="#12233f" stroke-width="2" opacity="0.6" />
        <line x1="170" y1="120" x2="170" y2="308" stroke="#12233f" stroke-width="2" opacity="0.6" />

        <!-- Chest pockets with flaps -->
        <g stroke="#1b3053" stroke-width="2.5" fill="#3f68a8" stroke-linejoin="round">
          <path d="M116 150 h34 v10 l-17 8 -17 -8 z" />
          <path d="M170 150 h34 v10 l-17 8 -17 -8 z" />
        </g>

        <!-- Topstitching -->
        <g fill="none" stroke="#e6c876" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.85">
          <path d="M160 130 L160 306" />
          <path d="M112 120 L107 246" />
          <path d="M208 120 L213 246" />
          <path d="M116 150 h34 M170 150 h34" />
        </g>

        <!-- Buttons -->
        <g>
          <g fill="#e6c876" stroke="#8a7326" stroke-width="1">
            <circle cx="160" cy="150" r="5" /><circle cx="160" cy="192" r="5" />
            <circle cx="160" cy="234" r="5" /><circle cx="160" cy="276" r="5" />
            <circle cx="133" cy="176" r="3" /><circle cx="187" cy="176" r="3" />
          </g>
          <g fill="#fff" opacity="0.5">
            <circle cx="158" cy="148" r="1.6" /><circle cx="158" cy="190" r="1.6" />
            <circle cx="158" cy="232" r="1.6" /><circle cx="158" cy="274" r="1.6" />
          </g>
        </g>
      </svg>
    </div>

    <!-- Gentle hint, fades on its own -->
    <p id="hint">Step back so your upper body is in view</p>

    <!-- Live controls -->
    <div id="controls">
      <button id="flip" class="ctl" type="button" aria-label="Flip camera">🔄</button>
      <button id="shot" class="shutter" type="button" aria-label="Take photo"><span></span></button>
      <span class="ctl-spacer" aria-hidden="true"></span>
    </div>

    <!-- Tap-to-start fallback (shown only if the camera can't auto-open) -->
    <div id="start" class="screen" hidden>
      <div class="screen-inner">
        <div class="screen-emoji">🧥</div>
        <button id="start-btn" class="big-btn" type="button">Tap to open camera</button>
      </div>
    </div>

    <!-- Error screen -->
    <div id="error" class="screen" hidden>
      <div class="screen-inner">
        <div class="screen-emoji">📷</div>
        <p id="error-msg"></p>
        <button id="retry-btn" class="big-btn" type="button">Try again</button>
      </div>
    </div>

    <!-- Result after capture -->
    <div id="result" class="screen" hidden>
      <img id="photo" alt="Your try-on photo" />
      <div id="result-actions">
        <button id="retake" class="big-btn ghost" type="button">↺ Retake</button>
        <a id="save" class="big-btn" download="my-ootd.jpg">⬇ Save photo</a>
      </div>
    </div>

    <canvas id="canvas" hidden></canvas>
  </main>

  <script src="app.js"></script>
</body>
</html>
