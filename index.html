<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Fashion OOTD — curate and share your Outfit of the Day." />
  <meta name="theme-color" content="#1a1a1a" />
  <title>OOTD · Outfit of the Day</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%97%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#" aria-label="OOTD home">
        <span class="brand-mark">👗</span>
        <span class="brand-name">OOTD</span>
      </a>
      <div class="header-actions">
        <div class="search">
          <input type="search" id="search" placeholder="Search styles, tags, occasions…" aria-label="Search outfits" />
        </div>
        <button class="btn btn-primary" id="open-add" type="button">+ New Outfit</button>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">🌙</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Your Outfit of the Day, curated.</h1>
      <p>Log what you wore, tag the vibe, and build a lookbook you'll actually revisit.</p>
    </section>

    <nav class="filters" id="filters" aria-label="Filter by occasion"></nav>

    <section class="stats" id="stats" aria-live="polite"></section>

    <section class="grid" id="feed" aria-live="polite"></section>

    <p class="empty" id="empty" hidden>No outfits match your search. Try another tag or add a new look.</p>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Built with 🧵 — your looks are stored locally in your browser.</p>
    </div>
  </footer>

  <!-- Add / Edit outfit dialog -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title">New Outfit</h2>
        <button class="icon-btn" id="close-add" type="button" aria-label="Close">✕</button>
      </div>
      <form id="outfit-form" class="form">
        <label class="field">
          <span>Look title</span>
          <input type="text" name="title" required maxlength="60" placeholder="Cozy autumn layers" />
        </label>
        <label class="field">
          <span>Cover emoji or image URL</span>
          <input type="text" name="cover" placeholder="🧥 or https://…" />
        </label>
        <label class="field">
          <span>Notes</span>
          <textarea name="notes" rows="3" maxlength="240" placeholder="Oversized blazer, straight jeans, white sneakers."></textarea>
        </label>
        <div class="field-row">
          <label class="field">
            <span>Occasion</span>
            <select name="occasion">
              <option>Casual</option>
              <option>Work</option>
              <option>Date</option>
              <option>Party</option>
              <option>Athleisure</option>
              <option>Formal</option>
            </select>
          </label>
          <label class="field">
            <span>Weather</span>
            <select name="weather">
              <option>☀️ Sunny</option>
              <option>⛅ Mild</option>
              <option>🌧️ Rainy</option>
              <option>❄️ Cold</option>
              <option>🔥 Hot</option>
            </select>
          </label>
        </div>
        <label class="field">
          <span>Tags (comma separated)</span>
          <input type="text" name="tags" placeholder="minimal, neutral, denim" />
        </label>
        <div class="form-actions">
          <button type="button" class="btn" id="cancel-add">Cancel</button>
          <button type="submit" class="btn btn-primary">Save look</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
