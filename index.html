<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Try the jacket on — just open the camera and wear it." />
  <meta name="theme-color" content="#000000" />
  <title>Try On · OOTD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A5%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <!-- Live camera -->
    <video id="cam" playsinline autoplay muted></video>

    <!-- Contact shadow (multiplies onto the body to ground the jacket) -->
    <div id="shadow">
      <svg viewBox="0 0 320 340" preserveAspectRatio="none" aria-hidden="true">
        <path d="M114 92 Q138 84 160 88 Q182 84 206 92 L226 100 Q250 170 268 252 L250 260 Q236 200 214 152 Q214 230 210 300 Q186 312 160 314 Q134 312 110 300 Q106 230 106 152 Q84 200 70 260 L52 252 Q70 170 94 100 Z" fill="#000" />
      </svg>
    </div>

    <!-- The jacket. Warped in real perspective onto your torso by app.js. -->
    <div id="overlay">
      <svg id="jacket" viewBox="0 0 320 340" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-label="Denim jacket">
        <defs>
          <!-- Base denim: subtle top-lit vertical wash -->
          <linearGradient id="denim" x1="160" y1="80" x2="160" y2="316" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#5680bf" />
            <stop offset="0.45" stop-color="#456aa6" />
            <stop offset="1" stop-color="#324f7d" />
          </linearGradient>
          <!-- Torso cylinder: shadow wrapping into both sides -->
          <linearGradient id="bodyCyl" x1="106" y1="0" x2="214" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#0c1930" stop-opacity="0.62" />
            <stop offset="0.16" stop-color="#132542" stop-opacity="0.30" />
            <stop offset="0.36" stop-color="#132542" stop-opacity="0" />
            <stop offset="0.64" stop-color="#132542" stop-opacity="0" />
            <stop offset="0.84" stop-color="#132542" stop-opacity="0.30" />
            <stop offset="1" stop-color="#0c1930" stop-opacity="0.62" />
          </linearGradient>
          <!-- Vertical ambient occlusion (under collar + at hem) -->
          <linearGradient id="bodyAO" x1="0" y1="88" x2="0" y2="314" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#0c1930" stop-opacity="0.40" />
            <stop offset="0.14" stop-color="#0c1930" stop-opacity="0" />
            <stop offset="0.80" stop-color="#0c1930" stop-opacity="0" />
            <stop offset="1" stop-color="#0c1930" stop-opacity="0.42" />
          </linearGradient>
          <!-- Soft chest highlight (the lit front of the cylinder) -->
          <radialGradient id="bodyHi" cx="152" cy="146" r="82" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#d3e2f6" stop-opacity="0.32" />
            <stop offset="0.55" stop-color="#bcd2f0" stop-opacity="0.10" />
            <stop offset="1" stop-color="#bcd2f0" stop-opacity="0" />
          </radialGradient>
          <!-- Left/right sleeve cylinders (inner side, nearest body, is shaded) -->
          <linearGradient id="sleeveL" x1="50" y1="0" x2="108" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#0c1930" stop-opacity="0.60" />
            <stop offset="0.30" stop-color="#c3d6f0" stop-opacity="0.20" />
            <stop offset="0.52" stop-color="#132542" stop-opacity="0" />
            <stop offset="0.78" stop-color="#132542" stop-opacity="0.34" />
            <stop offset="1" stop-color="#0c1930" stop-opacity="0.66" />
          </linearGradient>
          <linearGradient id="sleeveR" x1="212" y1="0" x2="270" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#0c1930" stop-opacity="0.66" />
            <stop offset="0.22" stop-color="#132542" stop-opacity="0.34" />
            <stop offset="0.48" stop-color="#132542" stop-opacity="0" />
            <stop offset="0.70" stop-color="#c3d6f0" stop-opacity="0.20" />
            <stop offset="1" stop-color="#0c1930" stop-opacity="0.60" />
          </linearGradient>
          <!-- Raised center placket: lit left edge, shadowed right edge -->
          <linearGradient id="placket" x1="148" y1="0" x2="172" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#6f97d4" />
            <stop offset="0.5" stop-color="#4a70a9" />
            <stop offset="1" stop-color="#33517f" />
          </linearGradient>
          <!-- Metal shank button -->
          <radialGradient id="metal" cx="0.36" cy="0.30" r="0.85">
            <stop offset="0" stop-color="#fff6dc" />
            <stop offset="0.35" stop-color="#f0d488" />
            <stop offset="0.72" stop-color="#c39a45" />
            <stop offset="1" stop-color="#7c5f22" />
          </radialGradient>
          <linearGradient id="collarLit" x1="0" y1="82" x2="0" y2="140" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#5f89ca" />
            <stop offset="1" stop-color="#3a5e97" />
          </linearGradient>
          <!-- Denim weave: fine indigo twill -->
          <pattern id="twill" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(34)">
            <rect width="5" height="5" fill="none" />
            <line x1="0" y1="0" x2="0" y2="5" stroke="#1c3255" stroke-width="1.5" opacity="0.55" />
            <line x1="2.6" y1="0" x2="2.6" y2="5" stroke="#7c9fd6" stroke-width="0.7" opacity="0.35" />
          </pattern>
          <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n" />
            <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.10  0 0 0 0 0.16  0 0 0 0 0.30  0 0 0 0.65 0" /></filter>
          <filter id="edgeShade" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" /></filter>
          <filter id="soft2"><feGaussianBlur stdDeviation="2" /></filter>

          <path id="silhouette" d="M114 92 Q138 84 160 88 Q182 84 206 92 L226 100 Q250 170 268 252 L250 260 Q236 200 214 152 Q214 230 210 300 Q186 312 160 314 Q134 312 110 300 Q106 230 106 152 Q84 200 70 260 L52 252 Q70 170 94 100 Z" />
          <path id="bodyPath" d="M114 92 Q138 84 160 88 Q182 84 206 92 Q210 118 214 152 Q214 230 210 300 Q186 312 160 314 Q134 312 110 300 Q106 230 106 152 Q108 118 114 92 Z" />
          <path id="sleeveLPath" d="M114 92 L94 100 Q70 170 52 252 L70 260 Q84 200 106 152 Q108 118 114 92 Z" />
          <path id="sleeveRPath" d="M206 92 L226 100 Q250 170 268 252 L250 260 Q236 200 214 152 Q210 118 206 92 Z" />
          <clipPath id="clip"><use href="#silhouette" /></clipPath>
          <clipPath id="clipBody"><use href="#bodyPath" /></clipPath>
          <clipPath id="clipSL"><use href="#sleeveLPath" /></clipPath>
          <clipPath id="clipSR"><use href="#sleeveRPath" /></clipPath>
        </defs>

        <!-- Base denim fill -->
        <use href="#silhouette" fill="url(#denim)" />

        <!-- Denim weave + grain across the whole garment -->
        <g clip-path="url(#clip)">
          <rect x="0" y="0" width="320" height="340" fill="url(#twill)" opacity="0.16" />
          <rect x="0" y="0" width="320" height="340" filter="url(#grain)" opacity="0.10" />
        </g>

        <!-- Sleeve volume -->
        <g clip-path="url(#clipSL)">
          <rect x="40" y="80" width="80" height="200" fill="url(#sleeveL)" />
        </g>
        <g clip-path="url(#clipSR)">
          <rect x="200" y="80" width="80" height="200" fill="url(#sleeveR)" />
        </g>

        <!-- Torso volume: cylinder shadow, vertical AO, chest highlight -->
        <g clip-path="url(#clipBody)">
          <rect x="106" y="80" width="108" height="240" fill="url(#bodyCyl)" />
          <rect x="106" y="80" width="108" height="240" fill="url(#bodyAO)" />
          <rect x="70" y="80" width="180" height="240" fill="url(#bodyHi)" />
          <!-- worn whiskering / fabric folds following the torso -->
          <g fill="none" stroke="#dbe7f7" stroke-width="4" opacity="0.10" stroke-linecap="round">
            <path d="M132 150 Q126 220 138 296" />
            <path d="M188 150 Q194 220 182 296" />
            <path d="M160 200 Q160 250 160 300" />
          </g>
          <g fill="none" stroke="#0e1c33" stroke-width="3" opacity="0.16" stroke-linecap="round">
            <path d="M120 156 Q112 220 120 298" />
            <path d="M200 156 Q208 220 200 298" />
          </g>
          <!-- armpit occlusion -->
          <path d="M110 150 Q128 168 122 210 Q104 190 104 156 Z" fill="#0c1930" opacity="0.30" filter="url(#soft2)" />
          <path d="M210 150 Q192 168 198 210 Q216 190 216 156 Z" fill="#0c1930" opacity="0.30" filter="url(#soft2)" />
        </g>

        <!-- Inner-edge shade for garment thickness + rolled seams -->
        <g clip-path="url(#clip)">
          <use href="#silhouette" fill="none" stroke="#0a1626" stroke-width="15" opacity="0.42" filter="url(#edgeShade)" />
        </g>

        <!-- Thin edge seam (definition without a cartoon outline) -->
        <use href="#silhouette" fill="none" stroke="#16294a" stroke-width="1.6" stroke-opacity="0.85" stroke-linejoin="round" />

        <!-- Rim light on the upper-left lit edges -->
        <g fill="none" stroke="#cfe0f7" stroke-width="1.8" opacity="0.55" stroke-linecap="round">
          <path d="M96 100 Q76 160 60 232" />
          <path d="M116 92 Q140 86 158 89" />
        </g>

        <!-- Collar: lit top faces + shadowed underside, cast shadow on chest -->
        <path d="M160 88 Q135 96 118 118 Q140 116 156 108 Z" fill="#16294a" opacity="0.35" filter="url(#soft2)" />
        <path d="M160 88 Q185 96 202 118 Q180 116 164 108 Z" fill="#16294a" opacity="0.35" filter="url(#soft2)" />
        <g stroke="#1b3053" stroke-width="1.4" stroke-linejoin="round" stroke-opacity="0.7">
          <path d="M160 86 L120 104 L126 140 L156 118 Z" fill="url(#collarLit)" />
          <path d="M160 86 L200 104 L194 140 L164 118 Z" fill="url(#collarLit)" />
          <path d="M156 118 L126 140 L134 146 L160 122 Z" fill="#2a4a80" />
          <path d="M164 118 L194 140 L186 146 L160 122 Z" fill="#2a4a80" />
        </g>

        <!-- Raised center placket with seams + buttonholes -->
        <rect x="149" y="112" width="22" height="196" rx="2" fill="url(#placket)" />
        <line x1="150.5" y1="114" x2="150.5" y2="306" stroke="#dfe9f8" stroke-width="1" opacity="0.5" />
        <line x1="169.5" y1="114" x2="169.5" y2="306" stroke="#0e1c33" stroke-width="1.4" opacity="0.55" />

        <!-- Chest pockets with buttoned flaps + drop shadow -->
        <g>
          <path d="M118 152 h30 v13 l-15 8 -15 -8 z" fill="#16294a" opacity="0.30" filter="url(#soft2)" transform="translate(1.5,3)" />
          <path d="M174 152 h30 v13 l-15 8 -15 -8 z" fill="#16294a" opacity="0.30" filter="url(#soft2)" transform="translate(1.5,3)" />
          <g stroke="#1b3053" stroke-width="1.4" stroke-opacity="0.65" stroke-linejoin="round">
            <path d="M118 152 h30 v13 l-15 8 -15 -8 z" fill="#3f66a4" />
            <path d="M174 152 h30 v13 l-15 8 -15 -8 z" fill="#3f66a4" />
          </g>
        </g>

        <!-- Topstitching -->
        <g fill="none" stroke="#e7c877" stroke-width="1.3" stroke-dasharray="4 3" opacity="0.72" stroke-linecap="round">
          <path d="M152 116 L152 304" />
          <path d="M168 116 L168 304" />
          <path d="M112 100 Q92 168 74 250" />
          <path d="M208 100 Q228 168 246 250" />
          <path d="M118 152 h30 M174 152 h30" />
          <path d="M120 165 l13 8 13 -8 M176 165 l13 8 13 -8" />
        </g>

        <!-- Buttons: metal shanks on placket, rivets on pockets -->
        <g stroke="#6a5220" stroke-width="0.8">
          <circle cx="160" cy="150" r="5.4" fill="url(#metal)" />
          <circle cx="160" cy="192" r="5.4" fill="url(#metal)" />
          <circle cx="160" cy="234" r="5.4" fill="url(#metal)" />
          <circle cx="160" cy="276" r="5.4" fill="url(#metal)" />
          <circle cx="133" cy="171" r="3.2" fill="url(#metal)" />
          <circle cx="189" cy="171" r="3.2" fill="url(#metal)" />
        </g>
        <g fill="#fff" opacity="0.6">
          <circle cx="158" cy="148" r="1.5" /><circle cx="158" cy="190" r="1.5" />
          <circle cx="158" cy="232" r="1.5" /><circle cx="158" cy="274" r="1.5" />
        </g>
      </svg>
    </div>

    <!-- Gentle hint, fades on its own -->
    <p id="hint">Step back so your upper body is in view</p>

    <!-- Live controls -->
    <div id="controls">
      <button id="flip" class="ctl" type="button" aria-label="Flip camera">🔄</button>
      <button id="shot" class="shutter" type="button" aria-label="Take photo"><span></span></button>
      <span class="ctl-spacer" aria-hidden="true"></span>
    </div>

    <!-- Tap-to-start fallback (shown only if the camera can't auto-open) -->
    <div id="start" class="screen" hidden>
      <div class="screen-inner">
        <div class="screen-emoji">🧥</div>
        <button id="start-btn" class="big-btn" type="button">Tap to open camera</button>
      </div>
    </div>

    <!-- Error screen -->
    <div id="error" class="screen" hidden>
      <div class="screen-inner">
        <div class="screen-emoji">📷</div>
        <p id="error-msg"></p>
        <button id="retry-btn" class="big-btn" type="button">Try again</button>
      </div>
    </div>

    <!-- Result after capture -->
    <div id="result" class="screen" hidden>
      <img id="photo" alt="Your try-on photo" />
      <div id="result-actions">
        <button id="retake" class="big-btn ghost" type="button">↺ Retake</button>
        <a id="save" class="big-btn" download="my-ootd.jpg">⬇ Save photo</a>
      </div>
    </div>

    <canvas id="canvas" hidden></canvas>
  </main>

  <script src="app.js"></script>
</body>
</html>
